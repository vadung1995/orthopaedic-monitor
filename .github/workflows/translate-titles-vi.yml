name: Translate Vietnamese article titles

on:
  workflow_dispatch:
    inputs:
      max_new:
        description: 'Max new titles per run (first test: 20-30, later 200-500)'
        required: false
        default: '30'
  schedule:
    # Daily at 10:23 and 22:23 Japan time; old translations are cached.
    - cron: '23 1,13 * * *'

permissions:
  contents: write
  pages: write

concurrency:
  group: vuslab-vietnamese-titles
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HOME: ${{ github.workspace }}/.hf_cache
      VI_MAX_NEW: ${{ github.event.inputs.max_new || '100' }}
    steps:
      - name: Checkout existing VUs LAB repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache the free translation model between runs
        uses: actions/cache@v4
        with:
          path: .hf_cache
          key: offline-en-vi-helsinki-v1
      - name: Install CPU-only free offline translator
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.46.3 sentencepiece==0.2.0 sacremoses==0.1.1
      - name: Translate English titles into Vietnamese (no API key required)
        run: python translate_titles_vi.py
      - name: Commit only new Vietnamese translations
        id: push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [[ ! -f data/title_vi.json ]]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No titles to commit.'
            exit 0
          fi
          git add data/title_vi.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No new translations.'
          else
            git commit -m 'Update cached Vietnamese titles using offline model'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Refresh existing GitHub Pages site
        if: steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # GITHUB_TOKEN-authored commits might not trigger branch-based Pages builds.
          # Rebuild request failure is logged but does not affect saved translations.
          status=$(curl --silent --show-error --output /tmp/pages-response.json \
            --write-out '%{http_code}' --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds" || true)
          echo "Pages rebuild status: $status"
          if [[ "$status" != '201' && "$status" != '202' ]]; then
            echo 'If titles are not yet visible, rerun the existing Pages deployment.'
          fi
